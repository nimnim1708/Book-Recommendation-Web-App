<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recommend Books</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body{
      min-height:100vh;
      background: linear-gradient(135deg, #ffe4f1, #f3e8ff);
      font-family: 'Quicksand', sans-serif;
      color:#4a2c3a;
    }

    .navy{
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(214,51,132,.12);
    }

    .brand{
      font-weight:800;
      color:#d63384 !important;
      letter-spacing:.4px;
    }

    .nav-link{
      color:#9b4778 !important;
      font-weight:700;
    }

    .page-title{
      font-weight:800;
      color:#d63384;
      font-size: clamp(2.2rem, 4vw, 3.4rem);
      text-align:center;
      margin-bottom:1rem;
    }

    .subtitle{
      text-align:center;
      color:#7a5a6c;
      font-weight:600;
      margin-bottom:2rem;
    }

    .search-box{
      max-width:820px;
      margin:0 auto;
      background:rgba(255,255,255,.82);
      border-radius:28px;
      padding:24px;
      box-shadow:0 14px 35px rgba(214,51,132,.16);
    }

    .input-wrap{
      position:relative;
    }

    .form-control{
      border-radius:18px !important;
      border:1px solid rgba(214,51,132,.18);
      padding:14px 18px;
      font-weight:600;
    }

    .form-control:focus{
      border-color:#d63384;
      box-shadow:0 0 0 .2rem rgba(214,51,132,.16);
    }

    #suggestions{
      position:absolute;
      top:calc(100% + 8px);
      left:0;
      right:0;
      background:rgba(255,255,255,.98);
      border:1px solid rgba(214,51,132,.16);
      border-radius:18px;
      box-shadow:0 18px 40px rgba(214,51,132,.18);
      overflow:hidden;
      z-index:50;
      display:none;
      max-height:260px;
      overflow-y:auto;
    }

    .s-item{
      padding:12px 14px;
      cursor:pointer;
      color:#9b4778;
      font-weight:600;
      border-bottom:1px solid rgba(214,51,132,.08);
    }

    .s-item:hover{
      background:#fff0f7;
    }

    .btn-cute{
      background:linear-gradient(135deg, #ff8ccf, #b693ff);
      border:0;
      color:white;
      font-weight:800;
      border-radius:18px;
      padding:12px 22px;
      box-shadow:0 12px 26px rgba(255,140,207,.28);
    }

    .btn-cute:hover{
      opacity:.95;
      color:white;
    }

    .card{
      border:0;
      border-radius:28px;
      overflow:hidden;
      background:rgba(255,255,255,.88);
      box-shadow:0 14px 35px rgba(214,51,132,.16);
      transition:transform .2s ease, box-shadow .2s ease;
    }

    .card:hover{
      transform:translateY(-6px);
      box-shadow:0 18px 45px rgba(214,51,132,.25);
    }

    .cover{
      height:250px;
      width:100%;
      object-fit:contain;
      background:#fff7fb;
      padding:16px;
    }

    .book-title{
      font-weight:800;
      color:#a64d79;
      line-height:1.25;
      font-size:1.05rem;
    }

    .book-author{
      color:#7a5a6c;
      font-weight:600;
    }
  </style>
</head>

<body>
  <nav class="navbar navy px-3">
    <div class="container-fluid">
      <a class="navbar-brand brand" href="/">My Book Recommender ✨</a>
      <div class="d-flex gap-3">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/recommend">Recommend</a>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h1 class="page-title">Find Your Next Read 💕</h1>
    <p class="subtitle">Enter a book title and get similar book recommendations.</p>

    <form action="/recommend_books" method="post" autocomplete="off" class="search-box">
      <div class="input-wrap">
        <input id="bookInput" name="user_input" type="text" class="form-control form-control-lg"
               placeholder="Enter a book name">
        <div id="suggestions"></div>
      </div>

      <button type="submit" class="btn btn-cute mt-3">Recommend ✨</button>
    </form>

    {% if data %}
    <div class="row g-4 mt-5">
      {% for i in data %}
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card h-100">
          <img class="cover" alt="book cover" src="{{ i[2] }}">
          <div class="p-3">
            <div class="book-title">{{ i[0] }}</div>
            <div class="book-author mt-2">{{ i[1] }}</div>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
    {% endif %}
  </div>

  <script>
    const input = document.getElementById("bookInput");
    const box = document.getElementById("suggestions");
    let lastQuery = "";

    function hideBox(){
      box.style.display = "none";
      box.innerHTML = "";
    }

    input.addEventListener("input", async () => {
      const q = input.value.trim();

      if (q.length < 2) {
        hideBox();
        return;
      }

      if (q === lastQuery) return;
      lastQuery = q;

      const res = await fetch(`/suggest?q=${encodeURIComponent(q)}`);
      const items = await res.json();

      if (!items.length) {
        hideBox();
        return;
      }

      box.innerHTML = items.map(t => `<div class="s-item">${t}</div>`).join("");
      box.style.display = "block";

      box.querySelectorAll(".s-item").forEach(el => {
        el.addEventListener("click", () => {
          input.value = el.textContent;
          hideBox();
          input.focus();
        });
      });
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".input-wrap")) hideBox();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") hideBox();
    });
  </script>
</body>
</html>
