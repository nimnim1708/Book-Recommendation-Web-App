<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Book Recommender</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body{
      min-height:100vh;
      background: linear-gradient(135deg, #ffe4f1, #f3e8ff);
      font-family: 'Quicksand', sans-serif;
      color:#4a2c3a;
    }

    .navy{
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(214,51,132,.12);
    }

    .brand{
      font-weight: 800;
      color:#d63384 !important;
      letter-spacing: .4px;
    }

    .nav-link{
      color:#9b4778 !important;
      font-weight:700;
    }

    .page-title{
      font-weight: 800;
      color:#d63384;
      font-size: clamp(2.2rem, 4vw, 3.4rem);
      text-align:center;
      margin-bottom: 2rem;
    }

    .card{
      border:0;
      border-radius: 28px;
      overflow:hidden;
      background: rgba(255,255,255,.88);
      box-shadow: 0 14px 35px rgba(214,51,132,.16);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .card:hover{
      transform: translateY(-6px);
      box-shadow: 0 18px 45px rgba(214,51,132,.25);
    }

    .cover{
      height: 250px;
      width: 100%;
      object-fit: contain;
      background: #fff7fb;
      padding: 16px;
    }

    .book-title{
      font-weight:800;
      color:#a64d79;
      line-height:1.25;
      font-size:1.05rem;
    }

    .muted{
      color:#7a5a6c;
      font-weight:600;
    }

    .pill{
      display:inline-flex;
      gap:.4rem;
      align-items:center;
      padding:.35rem .75rem;
      border-radius:999px;
      background:#fff0f7;
      border: 1px solid rgba(214,51,132,.16);
      color:#9b4778;
      font-weight:700;
      font-size:.9rem;
    }
  </style>
</head>

<body>
  <nav class="navbar navy px-3">
    <div class="container-fluid">
      <a class="navbar-brand brand" href="/">My Book Recommender ✨</a>
      <div class="d-flex gap-3">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/recommend">Recommend</a>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h1 class="page-title">Top 50 Popular Books 💕</h1>

    <div class="row g-4">
      {% for i in range(book_name|length) %}
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card h-100">
          <img class="cover" alt="book cover" src="{{ image[i] }}">
          <div class="p-3">
            <div class="book-title">
              {{ book_name[i] }}
            </div>
            <div class="muted mt-2">{{ author[i] }}</div>

            <div class="d-flex gap-2 flex-wrap mt-3">
              <span class="pill">Votes {{ votes[i] }}</span>
              <span class="pill">⭐ {{ "%.2f"|format(rating[i]) }}</span>
            </div>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
